<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Driver Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-light: #f0f2f5;
      --bg-dark: #121212;
      --text-light: #003b4a;
      --text-dark: #e0e0e0;
      --primary: #2196f3;
      --primary-dark: #1976d2;
      --shadow-color: rgba(0, 0, 0, 0.2);
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #FFD600 0%, #fff 100%);
      color: #111;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    .login-container {
      position: relative;
      z-index: 2;
      background: #fff;
      border-radius: 1rem;
      padding: 2.5rem;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: #111;
      font-weight: 700;
      font-size: 2rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.08);
    }

    .input-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .input-field {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      border: 1px solid #ccc;
      border-radius: 1rem;
      background: #fff;
      color: #111;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .input-field::placeholder {
      color: #888;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.2);
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #FFD600;
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 1rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #111;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 1.5rem;
        width: 95%;
      }

      .login-container h2 {
        font-size: 1.75rem;
      }

      .input-field {
        padding: 0.875rem 0.875rem 0.875rem 2.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h2>Driver Login</h2>
    <div class="input-group">
      <i class="fas fa-bus input-icon"></i>
      <input type="text" id="busId" class="input-field" placeholder="Enter Bus ID" required>
    </div>
    <div class="input-group">
      <i class="fas fa-lock input-icon"></i>
      <input type="password" id="password" class="input-field" placeholder="Enter Password" required>
    </div>
    <button class="login-btn" onclick="login()">
      <i class="fas fa-sign-in-alt"></i>
      Login
    </button>
  </div>

  <script>
    // Valid Bus IDs and Password
    const validBusIds = ["R01", "R02", "R17", "R20"];
    const validPassword = "123";

    // Login logic
    function login() {
      const busId = document.getElementById("busId").value.trim();
      const password = document.getElementById("password").value;

      if (!busId || !password) {
        alert("Please enter both Bus ID and Password.");
        return;
      }

      if (validBusIds.includes(busId) && password === validPassword) {
        window.location.href = `driver-map.html?bus=${busId}`;
      } else {
        alert("Invalid Bus ID or Password.");
      }
    }

    // Add enter key support
    document.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        login();
      }
    });
  </script>
</body>

</html>
