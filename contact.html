<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us </title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #FFD600 0%, #fff 100%);
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .contact-container {
      background: #fff;
      border-radius: 18px;
      padding: 2.5rem 2.2rem 2.2rem 2.2rem;
      max-width: 400px;
      width: 95vw;
      margin: 32px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.13);
    }
    .contact-container h2 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      text-align: center;
      letter-spacing: 1px;
      color: #111;
      text-shadow: 0 2px 12px #000a;
    }
    .contact-list {
      width: 100%;
      margin-bottom: 1.5rem;
    }
    .contact-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f0f2f5;
      border-radius: 12px;
      padding: 0.7rem 1rem;
      margin-bottom: 0.7rem;
      color: #111;
      font-size: 1.05rem;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(18, 115, 250, 0.08);
    }
    .contact-item .label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .supervisor {
      background: linear-gradient(90deg, #1273fa 60%, #111 100%);
      color: #111;
      font-weight: 700;
      font-size: 1.1rem;
      border-radius: 14px;
      padding: 1rem 1.2rem;
      margin: 1.2rem 0 0.7rem 0;
      box-shadow: 0 4px 16px 0 #1273fa33;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .supervisor i {
      margin-right: 0.7rem;
      font-size: 1.3rem;
    }
    @media (max-width: 600px) {
      .contact-container {
        padding: 1.2rem 0.5rem;
        max-width: 98vw;
      }
      .supervisor {
        font-size: 1rem;
        padding: 0.8rem 0.5rem;
      }
      .contact-item {
        font-size: 0.98rem;
        padding: 0.6rem 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="contact-container">
    <h2><i class="fas fa-address-book"></i> Contact Us</h2>
    <div class="contact-list">
      <div class="contact-item">
        <span class="label"><i class="fas fa-bus"></i>Driver R01</span>
        <span><a href="tel:+911234567890" style="color:#111;text-decoration:none;"><i class="fas fa-phone"></i> +91 12345 67890</a></span>
      </div>
      <div class="contact-item">
        <span class="label"><i class="fas fa-bus"></i>Driver R02</span>
        <span><a href="tel:+919876543210" style="color:#111;text-decoration:none;"><i class="fas fa-phone"></i> +91 98765 43210</a></span>
      </div>
      <div class="contact-item">
        <span class="label"><i class="fas fa-bus"></i>Driver R17</span>
        <span><a href="tel:+919112233445" style="color:#111;text-decoration:none;"><i class="fas fa-phone"></i> +91 91122 33445</a></span>
      </div>
      <div class="contact-item">
        <span class="label"><i class="fas fa-bus"></i>Driver R20</span>
        <span><a href="tel:+919998887776" style="color:#111;text-decoration:none;"><i class="fas fa-phone"></i> +91 99988 87776</a></span>
      </div>
    </div>
    <div class="supervisor">
      <i class="fas fa-user-tie"></i>
      Bus Supervisor: <a href="tel:+919000112233" style="color:#111;text-decoration:underline;margin-left:0.5rem;"><i class="fas fa-phone"></i> +91 90001 12233</a>
    </div>
  </div>
</body>
</html>
