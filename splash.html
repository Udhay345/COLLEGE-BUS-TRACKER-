<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RIT bus tracker</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #0072ff, #000000);
      overflow: hidden;
    }

    .logo {
      width: 300px;
      max-width: 90%;
      animation: zoomIn 2s ease-in-out forwards;
    }

    @keyframes zoomIn {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
      }
      100% {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <img src="rit-logo.png" alt="RIT Logo" class="logo">

  <script>
    // Redirect to index.html after 3 seconds
    setTimeout(() => {
      window.location.href = "index1.html";
    }, 3000);
  </script>

</body>
</html>
